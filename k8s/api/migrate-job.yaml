apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  namespace: ecommerce
  labels:
    app: shopnow
    component: api
    job-type: migrate
  annotations:
    # Job.spec.template is immutable in Kubernetes — a plain-resource sync
    # tries to patch this Job in place on every image-tag bump and always
    # fails with "field is immutable". Running it as a PreSync hook tells
    # ArgoCD to delete the old Job and create a fresh one instead of
    # patching, and guarantees migrations complete before the api
    # Deployment's new pods roll out.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: shopnow
        component: api
        job-type: migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          securityContext:
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready -h postgres -p 5432 -U ecom_user; do
                echo "PostgreSQL not ready — retrying in 3s"
                sleep 3
              done
              echo "PostgreSQL is ready."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: migrate
          image: ghcr.io/johnitopaisah/ecommerce-api:v0.1.6-rc1
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -e
              # Without set -e, a failing step (confirmed live: collectstatic
              # failing its GCS client init) just falls through to the next
              # line and the Job still reports Complete/exit 0.
              echo "Running migrations..."
              python manage.py migrate --noinput
              echo "Collecting static files..."
              python manage.py collectstatic --noinput
              echo "Done."
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles
            - name: tmp
              mountPath: /tmp
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: SECRET_KEY
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DB_PASSWORD
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: EMAIL_HOST_USER
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: EMAIL_HOST_PASSWORD
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: STRIPE_PUBLISHABLE_KEY
            - name: STRIPE_ENDPOINT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: STRIPE_ENDPOINT_SECRET
      volumes:
        - name: staticfiles
          emptyDir: {}
        - name: tmp
          emptyDir: {}
