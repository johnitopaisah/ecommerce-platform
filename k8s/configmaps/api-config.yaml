apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: ecommerce
  labels:
    app: shopnow
    component: api
data:
  # Use local settings — same as production but without HTTPS enforcement
  DJANGO_SETTINGS_MODULE: "config.settings.local"
  DEBUG: "False"
  ALLOWED_HOSTS: "shopnow.local,localhost,127.0.0.1"

  # Database connection
  DATABASE_URL: "postgres://ecom_user:ecom_pass@postgres:5432/ecommerce_db"
  DB_HOST: "postgres"
  DB_PORT: "5432"

  # Redis
  REDIS_URL: "redis://redis:6379/0"

  # CORS
  CORS_ALLOWED_ORIGINS: "http://shopnow.local,http://localhost"

  # JWT
  JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "60"
  JWT_REFRESH_TOKEN_LIFETIME_DAYS: "7"

  # Email
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"
  EMAIL_USE_SSL: "False"
  DEFAULT_FROM_EMAIL: "ShopNow <johnitopaisah@gmail.com>"

  # Frontend
  FRONTEND_URL: "http://shopnow.local"

  # Gunicorn
  GUNICORN_WORKERS: "3"
  GUNICORN_THREADS: "2"
  GUNICORN_TIMEOUT: "120"

  # S3 disabled
  USE_S3: "False"
