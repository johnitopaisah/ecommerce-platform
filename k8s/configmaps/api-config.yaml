apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: ecommerce
  labels:
    app: shopnow
    component: api
data:
  # Use local settings — same as production but without HTTPS enforcement
  DJANGO_SETTINGS_MODULE: "config.settings.local"
  DEBUG: "False"
  # "api" is the in-cluster Service DNS name — Next.js's server-side proxy
  # (INTERNAL_API_URL=http://api:8000) sends Host: api, distinct from the
  # public Host: shopnow.johnisah.com used by browser-facing requests.
  ALLOWED_HOSTS: "shopnow.johnisah.com,api,shopnow.local,localhost,127.0.0.1"

  # Database connection
  DATABASE_URL: "postgres://ecom_user:ecom_pass@postgres:5432/ecommerce_db"
  DB_HOST: "postgres"
  DB_PORT: "5432"

  # Redis
  REDIS_URL: "redis://redis:6379/0"

  # CORS — production domain only. (Previously also listed http://shopnow.local
  # and http://localhost, which have no business being allowed CORS origins on
  # the live deployment — dev-testing leftovers, tightened during the auth/
  # security hardening pass.)
  CORS_ALLOWED_ORIGINS: "https://shopnow.johnisah.com"

  # CSRF — must include scheme; see config/settings/production.py
  CSRF_TRUSTED_ORIGINS: "https://shopnow.johnisah.com"

  # JWT
  JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "60"
  JWT_REFRESH_TOKEN_LIFETIME_DAYS: "7"

  # Email — backend only; HOST/PORT/TLS/SSL/DEFAULT_FROM_EMAIL come from
  # api-secret (see k8s/api/deployment.yaml) so there is exactly one source
  # of truth. Previously this ConfigMap also shadowed those with stale
  # smtp.gmail.com values while api-secret had the real Zoho settings — the
  # deployment only ever explicitly wired EMAIL_HOST_USER/PASSWORD from the
  # secret, so the wrong ConfigMap values silently won and activation/reset
  # emails were failing SMTP auth on every send.
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"

  # Frontend
  FRONTEND_URL: "https://shopnow.johnisah.com"

  # Gunicorn
  GUNICORN_WORKERS: "3"
  GUNICORN_THREADS: "2"
  GUNICORN_TIMEOUT: "120"

  # GCS media/static storage
  USE_GCS: "True"
  GS_BUCKET_NAME: "shopnow-media"
