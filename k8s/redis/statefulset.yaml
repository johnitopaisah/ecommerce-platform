apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ecommerce
  labels:
    app: shopnow
    component: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: shopnow
      component: redis
  template:
    metadata:
      labels:
        app: shopnow
        component: redis
    spec:
      # redis:7-alpine defaults to root despite having a "redis" user (uid
      # 999, gid 1000) — fsGroup fixes up the mounted PVC's group ownership
      # to allow the non-root process to keep writing its existing data.
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - redis-server
            - --save
            - "60"
            - "1"
            - --loglevel
            - warning
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 512Mi
