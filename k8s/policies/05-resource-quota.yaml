# ============================================================
#  ResourceQuota — ecommerce namespace
#
#  Cluster capacity: 2-node Minikube, shared with portfolio-mcs
#  (whose own ResourceQuota already reserves requests.cpu=3,
#  requests.memory=4Gi, limits.cpu=8, limits.memory=10Gi).
#
#  ShopNow steady-state (min HPA replicas: api×2, user-ui×2, admin-ui×1,
#  postgres×1, redis×1), using the api container's real 384Mi memory
#  request (raised from 256Mi after kubectl top showed genuine ~300-314Mi
#  steady-state usage per pod — see k8s/api/deployment.yaml):
#    requests.cpu:    ~1,150m
#    requests.memory: ~1,472Mi
#
#  Confirmed live: the original 2Gi requests.memory ceiling (sized for the
#  old 256Mi/pod baseline) never got raised alongside that fix, so it
#  silently became the binding constraint the next time the HPA scaled up
#  — blocking the api-migrate PreSync hook from ever getting a pod and
#  stalling every subsequent deploy. Node capacity check at the time:
#  2 nodes × 4 CPU × ~16Gi memory, with portfolio-mcs's own quota already
#  reserving requests.cpu=3/requests.memory=4Gi — plenty of real headroom
#  existed, the quota number itself was just stale.
#
#  Sized below for HPA to scale up to ~6-8 api replicas plus one-off Job
#  bursts (migrate) without hitting the ceiling, while still leaving
#  requests.cpu=3/requests.memory=4Gi of margin against the raw 8 CPU /
#  ~32Gi node total once portfolio-mcs's reservation is added in.
# ============================================================

apiVersion: v1
kind: ResourceQuota
metadata:
  name: shopnow-quota
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: shopnow
    app.kubernetes.io/managed-by: argocd
spec:
  hard:
    requests.cpu:    "3"
    requests.memory: "4Gi"
    limits.cpu:      "6"
    limits.memory:   "10Gi"
    pods:            "20"
    services:        "10"
    persistentvolumeclaims: "3"
