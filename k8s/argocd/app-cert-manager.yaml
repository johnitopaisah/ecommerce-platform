apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopnow-cert-manager
  namespace: argocd
  labels:
    app.kubernetes.io/name: shopnow-cert-manager
    app.kubernetes.io/part-of: shopnow
    app.kubernetes.io/component: cert-manager
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # ClusterIssuer needed before ingress TLS
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: shopnow
  source:
    repoURL: https://github.com/johnitopaisah/ecommerce-platform
    targetRevision: develop
    path: k8s/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=false
  ignoreDifferences:
    - group: cert-manager.io
      kind: ClusterIssuer
      jsonPointers:
        - /status   # cert-manager populates status at runtime
