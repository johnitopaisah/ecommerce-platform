# EC2 Nginx config — forwards HTTP and HTTPS to minikube ingress
# TLS is terminated at minikube ingress by cert-manager
# EC2 Nginx acts as a TCP passthrough for port 443

upstream minikube_http {
    server 192.168.49.2:80;
    keepalive 32;
}

upstream minikube_https {
    server 192.168.49.2:443;
    keepalive 32;
}

# ── HTTP → redirect to HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name shopnow.johnisah.com _;

    # Let cert-manager HTTP-01 challenges through (must stay on HTTP)
    location /.well-known/acme-challenge/ {
        proxy_pass http://minikube_http;
        proxy_set_header Host shopnow.johnisah.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Redirect all other HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS → minikube ingress (TLS already handled by cert-manager) ────────────
server {
    listen 443 ssl;
    server_name shopnow.johnisah.com;

    # Self-signed placeholder cert on EC2 Nginx itself — traffic is
    # actually re-encrypted by minikube ingress with the real cert.
    # We use ssl_passthrough instead — see stream block below.
    # This server block is kept for reference; stream handles the actual passthrough.
}
