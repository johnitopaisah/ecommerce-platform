upstream api {
    server api:8000;
}

upstream user_ui {
    server user-ui:3000;
}

upstream admin_ui {
    server admin-ui:3001;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # ── Django API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django admin panel
    location /django-admin/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Media files (served by Nginx directly in production) ──────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Static files (collected by Django) ───────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Admin UI (on /admin-panel/ prefix) ───────────────────────────────────
    # No rewrite here — admin-ui's own Next.js basePath ("/admin-panel") is
    # what expects and strips this prefix internally. Stripping it again
    # here meant admin-ui received a bare "/login" it never recognized as
    # one of its own routes (basePath-configured apps only match requests
    # *with* the prefix), producing a 404 for every admin-panel route.
    # Matches how the live Traefik ingress already forwards the full path.
    #
    # The bare "/admin-panel" (no trailing slash) needs its own exact-match
    # block: without it, that specific request doesn't satisfy the prefix
    # location below (it's one character short of "/admin-panel/") and
    # nginx redirects it to add the slash — which collides head-on with
    # admin-ui's own default trailingSlash:false behavior redirecting the
    # slash back off, producing an infinite 301/308 loop. Exact matches are
    # checked before prefix matches, so this intercepts it before that
    # ambiguity ever arises and hands it to admin-ui unchanged, which
    # resolves it correctly on its own (its root page redirects to
    # /admin-panel/dashboard, already confirmed working).
    location = /admin-panel {
        proxy_pass http://admin_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-panel/ {
        proxy_pass http://admin_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── User UI (everything else) ─────────────────────────────────────────────
    location / {
        proxy_pass http://user_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
