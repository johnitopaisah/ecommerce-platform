# ============================================================
#  API — CI Pipeline
#
#  Stages: validate → quality (lint + test) → build → push → scan → update-manifest → summary
#
#  Image: <IMAGE_REGISTRY_BASE>/ecommerce-api:<tag>
#  Runtime: Python 3.13 | Django REST Framework
#
#  Required GitHub Variables (Settings → Secrets and variables → Variables):
#    IMAGE_REGISTRY_BASE   e.g. johnitopaisah
#
#  Required GitHub Secrets:
#    DOCKERHUB_USERNAME    Docker Hub username
#    DOCKERHUB_TOKEN       Docker Hub access token
# ============================================================

name: API

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag  e.g. v1.0.0 | v1.0.0-rc | v1.0.0-rc1"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write         # write needed for manifest update commit
  packages: write
  security-events: write  # upload Trivy SARIF to GitHub Security tab

env:
  IMAGE:      ${{ vars.IMAGE_REGISTRY_BASE }}/ecommerce-api
  PYTHON_VER: "3.13"

jobs:

  # ── 1. Validate tag ──────────────────────────────────────
  validate:
    name: Validate tag
    uses: ./.github/workflows/_validate-tag.yml
    with:
      tag: ${{ inputs.tag }}

  # ── 2. Lint & test ───────────────────────────────────────
  quality:
    name: Lint & test
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       ecommerce_test
          POSTGRES_USER:     ecom_user
          POSTGRES_PASSWORD: ecom_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify IMAGE_REGISTRY_BASE is set
        run: |
          [ -z "${{ vars.IMAGE_REGISTRY_BASE }}" ] \
            && echo "❌ IMAGE_REGISTRY_BASE not set" && exit 1 \
            || echo "✅ IMAGE_REGISTRY_BASE=${{ vars.IMAGE_REGISTRY_BASE }}"

      - name: Setup Python ${{ env.PYTHON_VER }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django coverage flake8

      - name: Create test .env
        run: |
          cat > .env << 'ENVEOF'
          SECRET_KEY=ci-test-secret-key-not-for-production-use-at-all
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_URL=postgres://ecom_user:ecom_pass@localhost:5432/ecommerce_test
          REDIS_URL=redis://localhost:6379/0
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          JWT_ACCESS_TOKEN_LIFETIME_MINUTES=60
          JWT_REFRESH_TOKEN_LIFETIME_DAYS=7
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          DEFAULT_FROM_EMAIL=noreply@test.com
          FRONTEND_URL=http://localhost:3000
          STRIPE_PUBLISHABLE_KEY=pk_test_dummy
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_ENDPOINT_SECRET=whsec_dummy
          USE_S3=False
          ENVEOF

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: python manage.py migrate --noinput

      - name: Flake8 lint
        run: flake8 apps/ config/ --statistics --count

      - name: Check no placeholder secrets in source
        run: |
          BAD=0
          for PAT in "changeme" "REPLACE_THIS" "your-secret-here"; do
            if grep -r "$PAT" apps/ config/ --include="*.py" -l 2>/dev/null; then
              echo "❌ Found placeholder '$PAT'"; BAD=1
            fi
          done
          [ $BAD -eq 0 ] && echo "✅ No placeholders found"
          exit $BAD

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          coverage run -m pytest apps/ -v --tb=short 2>&1 | tee test-results.txt \
            || echo "No tests found yet — skipping"
          coverage report --skip-covered || true
          coverage xml -o coverage.xml || true

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: api/coverage.xml
          flags: api
          fail_ci_if_error: false

  # ── 3. Build & push ──────────────────────────────────────
  build-push:
    name: Build & push
    needs: [validate, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context:    ./api
          push:       true
          provenance: false
          tags: |
            ${{ vars.IMAGE_REGISTRY_BASE }}/ecommerce-api:${{ needs.validate.outputs.tag }}
            ${{ vars.IMAGE_REGISTRY_BASE }}/ecommerce-api:latest
          cache-from: type=gha,scope=api
          cache-to:   type=gha,scope=api,mode=max

  # ── 4. Trivy image scan ──────────────────────────────────
  scan:
    name: Scan image
    needs: [validate, build-push]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ vars.IMAGE_REGISTRY_BASE }}/ecommerce-api:${{ needs.validate.outputs.tag }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: api/.trivyignore

      - name: Run Trivy vulnerability scanner (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ vars.IMAGE_REGISTRY_BASE }}/ecommerce-api:${{ needs.validate.outputs.tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: api/.trivyignore

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ── 5. Update manifest ───────────────────────────────────
  update-manifest:
    name: Update k8s manifest
    needs: [validate, scan]
    runs-on: ubuntu-latest
    if: needs.scan.result == 'success'
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in manifest
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          BASE="${{ vars.IMAGE_REGISTRY_BASE }}"
          sed -i "s|${BASE}/ecommerce-api:.*|${BASE}/ecommerce-api:${TAG}|g" k8s/api/deployment.yaml
          echo "✅ k8s/api/deployment.yaml → ${BASE}/ecommerce-api:${TAG}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.validate.outputs.tag }}"
          git add k8s/api/deployment.yaml
          git diff --cached --quiet && echo "No manifest change needed" && exit 0
          git commit -m "chore: bump api image to ${TAG} [skip ci]"
          PUSHED=false
          for i in 1 2 3 4 5; do
            git pull --rebase origin develop && git push origin develop && { PUSHED=true; break; }
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          [ "$PUSHED" = "true" ] || { echo "❌ Failed to push after 5 attempts"; exit 1; }
          echo "✅ Manifest updated — ArgoCD will sync shortly"

  # ── 6. Summary ───────────────────────────────────────────
  summary:
    name: Summary
    needs: [validate, quality, build-push, scan, update-manifest]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write summary
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          QUALITY="${{ needs.quality.result }}"
          BUILD="${{ needs.build-push.result }}"
          SCAN="${{ needs.scan.result }}"
          MANIFEST="${{ needs.update-manifest.result }}"
          ok() { [ "$1" = "success" ] && echo "✅" || ( [ "$1" = "skipped" ] && echo "⏭️" || echo "❌" ); }
          echo "## API pipeline" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & test     | $(ok $QUALITY) $QUALITY |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & push    | $(ok $BUILD) $BUILD |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy scan      | $(ok $SCAN) $SCAN |" >> $GITHUB_STEP_SUMMARY
          echo "| Update manifest | $(ok $MANIFEST) $MANIFEST |" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ vars.IMAGE_REGISTRY_BASE }}/ecommerce-api:$TAG\`" >> $GITHUB_STEP_SUMMARY
